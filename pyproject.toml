#:schema https://json.schemastore.org/pyproject.json
[project]
dependencies = [
  "frictionless[json,parquet]>=5.18.1",
  "niquests>=3.11.2",
  "pandas>=2.2.3",
  "polars>=2.0.0",
  "tomli-w>=1.1.0",
]
description = "Common repository for example datasets used by Vega related projects."
name = "vega-datasets"
readme = "README.md"
requires-python = ">=3.12"
version = "3.3.0"

[dependency-groups]
dev = [
  "ipython[kernel]>=8.30.0",
  "pytest>=9",
  "ruff>=0.17.2",
  "taplo>=0.9.3",
  { include-group = "gallery-examples" },
  { include-group = "site" },
]
gallery-examples = ["httpx>=0.28.1,<0.29"]
geo-species = [
  "exactextract>=0.2.1",
  "geopandas",
  "pandas[pyarrow]",
  "pyarrow-stubs",
  "rasterio",
  "requests",
  "sciencebasepy",
  "setuptools",
  "tqdm",
]
site = ["pillow>=13.0.0", { include-group = "gallery-examples" }]

[tool.pytest.ini_options]
markers = [
  "slow: full schema/row validation via frictionless; opt in with --runslow",
]
# Repo root on sys.path so tests can import scripts.generate_gallery_examples.
pythonpath = ["."]
testpaths  = ["tests"]

[tool.ruff]
extend-exclude = [
  ".venv",
  "scripts/budget.py",
  "scripts/github.py",
  "scripts/make-unemployment-across-industries.py",
  "scripts/update_countries_json.py",
  "scripts/update_gapminder.py",
  "scripts/weather.py",
]
format = { docstring-code-format = true, preview = true }
target-version = "py312"

[tool.ruff.lint]
extend-safe-fixes = [
  # https://docs.astral.sh/ruff/linter/#fix-safety
  "C4",                 # flake8-comprehensions
  "D",                  # pydocstyle 
  "EM",                 # flake8-errmsg
  "PLC",                # pylint (Convention)
  "TC",                 # flake8-type-checking
  "UP",                 # pyupgrade
  "literal-membership", # https://docs.astral.sh/ruff/rules/literal-membership/#fix-safety
]
extend-select = [
  # https://docs.astral.sh/ruff/preview/#using-rules-that-are-in-preview
  "FURB",                          # refurb
  "literal-membership",
  "root-logger-call",
  "unnecessary-dict-index-lookup",
  "unnecessary-list-index-lookup",
  "unspecified-encoding",
]
ignore = [
  "any-type",
  "doc-line-too-long",                     # no auto-fix
  "docstring-tab-indentation",             # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "line-too-long",                         # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "missing-blank-line-after-last-section",
  "multi-line-summary-first-line",         # conflicts with multi-line-summary-second-line
  "non-imperative-mood",
  "undocumented-magic-method",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "undocumented-public-package",
]
isort = { split-on-trailing-comma = false }
preview = true
pydocstyle = { convention = "numpy" }
select = [
  "ANN",                            # flake8-annotations
  "B",                              # flake8-bugbear
  "BLE",                            # flake8-blind-except
  "C4",                             # flake8-comprehensions
  "C90",                            # mccabe (complex-structure)
  "D",                              # pydocstyle
  "E",                              # pycodestyle-error
  "EM",                             # flake8-errmsg
  "F",                              # pyflakes
  "FA",                             # flake8-future-annotations
  "FLY",                            # flynt
  "I",                              # isort
  "LOG",                            # flake8-logging
  "PIE",                            # flake8-pie
  "PLC",                            # pylint (Convention)
  "PTH",                            # flake8-use-pathlib
  "RUF",                            # Ruff-specific rules
  "SIM",                            # flake8-simplify
  "TC",                             # flake8-type-checking
  "TID",                            # flake8-tidy-imports
  "TRY",                            # tryceratops
  "UP",                             # pyupgrade
  "W",                              # pycodestyle-warning
  "collapsible-else-if",
  "logging-f-string",
  "manual-from-import",
  "multi-line-summary-second-line",
  "nested-min-max",
  "repeated-equality-comparison",
  "subprocess-run-without-check",
  "superfluous-else-return",
  "unnecessary-assign",
  "unnecessary-type-union",
  "useless-else-on-loop",
  "useless-return",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb"      = ["ANN", "too-many-newlines-at-end-of-file", "unused-import"]
"*/**/*.ipynb" = ["ANN", "too-many-newlines-at-end-of-file", "unused-import"]
# The generator's extensive behavior tests favor compact fixtures.
"tests/test_generate_gallery_examples.py" = ["ANN", "D"]

[tool.pyright]
enableExperimentalFeatures = true
ignore = ["../../../**/Lib"]
include = [
  "./scripts/build_datapackage.py",
  "./scripts/build_site_catalog.py",
  "./scripts/flights.py",
  "./scripts/generate_gallery_examples.py",
  "./scripts/income.py",
  "./scripts/species.py",
]
pythonPlatform = "All"
pythonVersion = "3.12"
reportUnusedExpression = "none"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
