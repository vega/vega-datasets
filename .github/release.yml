changelog:
  exclude:
    labels: [dependencies]
  categories:
    - title: Breaking
      labels: [breaking]
    - title: Enhancements
      labels: [enhancement]
    - title: Bug Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Maintenance
      labels: [maintenance]
    - title: Other Changes
      labels: ["*"]
