name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    name: Test

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: 24

      - uses: astral-sh/setup-uv@v7
        with:
          version: ">=0.5.0"
          enable-cache: true

      - name: Format toml
        run: uv run taplo fmt --check --diff

      - name: Format and lint (python)
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Install Node dependencies
        run: npm ci

      # `npm run build` rewrites datapackage.json, so the later pytest run only
      # sees the regenerated descriptor. Check the committed one first so a
      # stale descriptor (a forgotten rebuild, or a CRLF re-save) fails CI.
      - name: Validate committed datapackage
        run: uv run pytest tests/test_datapackage.py

      - run: npm run build

      - name: Check packed package exports
        run: npm pack --dry-run --json --foreground-scripts=false | node scripts/check-package-exports.mjs

      - name: Validate datapackage
        run: uv run pytest tests/ -v --runslow --limit-rows 250000
