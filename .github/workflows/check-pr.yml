name: 'Lint PR'

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  label:
    name: Label PR from title
    needs: main
    runs-on: ubuntu-latest
    permissions:
      # issues: write lets the job create a missing label before adding it.
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Label the PR by its Conventional Commits type so that
            // .github/release.yml can group GitHub's generated release notes.
            const labelsByType = {
              feat: 'enhancement',
              perf: 'enhancement',
              fix: 'bug',
              docs: 'documentation',
              build: 'maintenance',
              chore: 'maintenance',
              ci: 'maintenance',
              refactor: 'maintenance',
              style: 'maintenance',
              test: 'maintenance',
            };

            function labelFor(title) {
              const match = /^(\w+)(?:\([^)]*\))?(!)?: /.exec(title);
              if (!match) return undefined;
              return match[2] ? 'breaking' : labelsByType[match[1]];
            }

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const current = new Set(pr.labels.map((l) => l.name));
            const label = labelFor(pr.title);

            // When the title's type changes, drop the label the old title gave.
            const previousTitle = context.payload.changes?.title?.from;
            const previous = previousTitle === undefined ? undefined : labelFor(previousTitle);
            if (previous && previous !== label && current.has(previous)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: previous });
            }

            if (label && !current.has(label)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name: label });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [label] });
            }
