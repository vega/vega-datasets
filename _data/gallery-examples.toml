# Upstream gallery sources consumed by scripts/generate_gallery_examples.py.
#
# Strategy: track each upstream repo's `main` branch because the deployed
# vega/vega-lite/altair galleries users see are also built from main. The
# script resolves main → commit SHA once per run and pins all subsequent
# URLs to that SHA so examples.json and every spec come from the same
# upstream snapshot. Resolved SHAs are logged at INFO for triage.
#
# Read-path: jsDelivr (`cdn.jsdelivr.net/gh/…`) — CDN-cached, follows the
# same refs (branches/tags/SHAs) as raw.githubusercontent.com. When URLs
# embed a commit SHA, jsDelivr caches forever with zero invalidation risk
# since SHAs are immutable. jsDelivr does intermittently 403 under
# concurrent bursts; the generator falls back to raw.githubusercontent.com
# per-file when that happens (see _get_checked in the script).

[ref]
# `main` is resolved to a SHA at script start. Change to a tag like "v6.4.2"
# to pin a gallery to a released version instead of tracking main.
vega_lite = "main"
vega      = "main"
altair    = "main"

[sources]
# `{…_ref}` placeholders are always substituted with the commit SHAs resolved
# from [ref], whether the configured values are branches, tags, or SHAs.
vega_lite_examples_url = "https://cdn.jsdelivr.net/gh/vega/vega-lite@{vega_lite_ref}/site/_data/examples.json"
vega_examples_url      = "https://cdn.jsdelivr.net/gh/vega/vega@{vega_ref}/docs/_data/examples.json"
# Altair publishes one record per rendered gallery page. Its index treats the
# arguments/attribute-syntax file as the canonical source; method-syntax files
# are alternate code presentations for a subset of those same pages.
altair_examples_url = "https://cdn.jsdelivr.net/gh/vega/altair@{altair_ref}/_data/examples.json"
